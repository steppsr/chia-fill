# chia-fill.conf
# Sourced by chia-fill.sh. CLI flags override these values.
# Paths, keys, and hosts are for THIS plotter machine and its remote harvester.

# --- plotter ---
PLOTTER="/home/steve/madmax/chia-plotter/build/chia_plot"
TMP_DIR="/mnt/ssd-ta/"                # chia_plot -t  (working temp)
TMP2_DIR="/mnt/ssd-ta/"               # chia_plot -2  (second temp; same disk or another)
STAGING_DIR="/mnt/ssd-tb/"            # chia_plot -d  (local finished-plot staging)
PLOT_COUNT=1                          # always 1: plot, then move, then plot again
POOL_CONTRACT="YOUR-POOL-CONTRACT-ADDRESS"
FARMER_KEY="YOUR-FARMER-KEY"
THREADS=20
PLOT_LOG="/home/steve/chialogs/chia.log"

# --- remote harvester (the real destination; NOT chia_plot -d) ---
DEST_USER="steve"
DEST_HOST="jango"
DEST_PATHS=(
    "/mnt/hdd-01"
    "/mnt/hdd-02"
    "/mnt/hdd-03"
)
BWLIMIT="800m"

# --- policy ---
MIN_FREE_GB=102                       # do not start a plot unless dest has at least this much free
PLOTTER_RETRIES=2                     # retries after a plotter failure, then abort
LOCK_FILE="/tmp/chia-fill.lock"
FILL_LOG=""                           # optional extra copy of chia-fill messages; empty = stdout only
